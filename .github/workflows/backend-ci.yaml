name: Backend Continuous Integration

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock
      - name: Install pipenv & dependencies
        run: |
          cd starter/backend
          python -m pip install pipenv
          pipenv install
      - name: Run Linter
        run: |
          cd starter/backend
          pipenv run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pipenv'
          cache-dependency-path: starter/backend/Pipfile.lock
      - name: Install pipenv & dependencies
        run: |
          cd starter/backend
          python -m pip install pipenv
          pipenv install
      - name: Run Tests
        run: |
          cd starter/backend
          pipenv run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          cd starter/backend
          docker build --tag mp-backend:latest .